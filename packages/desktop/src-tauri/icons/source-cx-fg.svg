<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Android adaptive-icon foreground: glyph only on transparency. The
       launcher composites it over @color/iconBackground (#000000), so the
       knockout gap must be painted in that colour, not left transparent —
       otherwise the C shows through the x. gen-icons.js rewrites this colour
       per target surface (e.g. the splash sits on #0a0a0a instead). -->
