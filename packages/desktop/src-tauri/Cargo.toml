[package]
name = "convertx"
version = "0.1.0"
description = "A desktop file converter"
authors = ["you"]
edition = "2021"

[lib]
name = "convertx_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Used for production builds (and any time there is no running dev server).
# When OFF, Tauri compiles in "dev" mode and the window loads `devUrl`
# (http://localhost:1420) instead of the embedded frontend — which fails on
# any machine that isn't running `npm run dev`. `tauri build` enables this
# automatically; a raw `cargo build --release` must pass --features custom-protocol.
# DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
