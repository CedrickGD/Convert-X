name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm install

      # Build the Svelte UI; cargo embeds packages/desktop/dist into the binary.
      - name: Build frontend
        run: npm run build -w @convertx/desktop

      # Compile the self-contained portable exe. No installer, no bundled tools —
      # the app downloads ffmpeg/yt-dlp/spotdl into AppData on first run.
      - name: Build portable exe
        working-directory: packages/desktop/src-tauri
        # --features custom-protocol is REQUIRED: without it Tauri builds in dev
        # mode and the shipped exe tries to load http://localhost:1420 instead of
        # the embedded UI. `tauri build` adds this automatically; raw cargo does not.
        run: cargo build --release --features custom-protocol

      - name: Stage the portable exe
        shell: pwsh
        run: Copy-Item packages/desktop/src-tauri/target/release/convertx.exe Convert-X.exe -Force

      # Mirror of the same step in android-release.yml: every release page
      # surfaces BOTH platforms, so neither is a dead end for someone who
      # landed on the wrong one.
      - name: Build cross-platform downloads section
        id: downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > rels.json

          # Newest published android release (bare `v*` tag) that has an arm64 APK.
          # Also pull the 32-bit armv7 asset from the SAME release when present
          # (older releases pre-date it, so the armv7 row is emitted only if found).
          android=$(jq -c '
            [ .[]
              | select(.draft == false and .prerelease == false)
              | select(.tag_name | test("^v[0-9]"))
              | { tag: .tag_name,
                  asset: ([ .assets[]
                            | select((.name | ascii_downcase | contains("arm64-v8a"))
                                 and (.name | ascii_downcase | endswith(".apk"))) ][0]),
                  armv7: ([ .assets[]
                            | select(.name == "app-armv7-release.apk") ][0]) }
              | select(.asset != null)
            ][0] // empty' rels.json)

          exe="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Convert-X.exe"
          {
            echo 'body<<RELEASE_BODY_EOF'
            echo 'Portable single-file build — no install, no admin. Download **Convert-X.exe** and run it; it fetches ffmpeg/yt-dlp on first use and self-updates from here on.'
            echo
            echo '### Downloads'
            echo
            echo '| Platform | Download |'
            echo '| --- | --- |'
            echo "| **Windows (desktop)** | [\`Convert-X.exe\`]($exe) — portable |"
            if [ -n "$android" ]; then
              a_tag=$(jq -r .tag         <<<"$android")
              a_name=$(jq -r .asset.name <<<"$android")
              a_url=$(jq -r .asset.browser_download_url <<<"$android")
              a_tag_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/$a_tag"
              echo "| **Android** (most phones) | [\`$a_name\`]($a_url) — 64-bit ARM sideload, from [\`$a_tag\`]($a_tag_url) |"
              v7_name=$(jq -r '.armv7.name // empty'                 <<<"$android")
              v7_url=$(jq -r '.armv7.browser_download_url // empty'  <<<"$android")
              if [ -n "$v7_url" ]; then
                echo "| **Android** (older / budget phones) | [\`$v7_name\`]($v7_url) — 32-bit ARM (armeabi-v7a), from [\`$a_tag\`]($a_tag_url) |"
              fi
            else
              echo "| **Android** | see [all releases](https://github.com/${GITHUB_REPOSITORY}/releases) |"
            fi
            echo
            echo '> Desktop and Android are versioned independently, so the newest Android build carries a different version number. Each in-app updater tracks its own release line.'
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Convert-X Desktop ${{ github.ref_name }}"
          # desktop-v0.3.0-beta.1 → prerelease (the in-app updater skips it);
          # desktop-v0.3.0 → the real release.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: ${{ steps.downloads.outputs.body }}
          fail_on_unmatched_files: true
          files: Convert-X.exe
