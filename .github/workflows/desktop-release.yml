name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm install

      # Build the Svelte UI; cargo embeds packages/desktop/dist into the binary.
      - name: Build frontend
        run: npm run build -w @convertx/desktop

      # Compile the self-contained portable exe. No installer, no bundled tools —
      # the app downloads ffmpeg/yt-dlp/spotdl into AppData on first run.
      - name: Build portable exe
        working-directory: packages/desktop/src-tauri
        run: cargo build --release

      - name: Stage the portable exe
        shell: pwsh
        run: Copy-Item packages/desktop/src-tauri/target/release/convertx.exe Convert-X.exe -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ConvertX ${{ github.ref_name }}"
          body: "Portable single-file build — no install, no admin. Download **Convert-X.exe** and run it; it fetches ffmpeg/yt-dlp on first use and self-updates from here on."
          fail_on_unmatched_files: true
          files: Convert-X.exe
