name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Fetch bundled binaries (ffmpeg/ffprobe/yt-dlp/spotdl)
        shell: pwsh
        working-directory: packages/desktop/src-tauri
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Write-Host "ffmpeg + ffprobe (BtbN gpl build)..."
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Copy-Item (Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe  | Select-Object -First 1).FullName bin/ffmpeg.exe  -Force
          Copy-Item (Get-ChildItem -Recurse ffmpeg_tmp -Filter ffprobe.exe | Select-Object -First 1).FullName bin/ffprobe.exe -Force
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force
          Write-Host "yt-dlp..."
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile bin/yt-dlp.exe
          Write-Host "spotdl (latest win32 asset)..."
          $rel = Invoke-RestMethod "https://api.github.com/repos/spotDL/spotify-downloader/releases/latest" -Headers @{ "User-Agent" = "convert-x-ci" }
          $spotUrl = ($rel.assets | Where-Object { $_.name -like "*win32.exe" } | Select-Object -First 1).browser_download_url
          if (-not $spotUrl) { throw "spotdl win32 asset not found" }
          Invoke-WebRequest $spotUrl -OutFile bin/spotdl.exe
          Get-ChildItem bin | Select-Object Name, Length

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ConvertX ${{ github.ref_name }}"
          releaseBody: "See assets below to download this version. The MSI is the recommended installer; the portable EXE requires FFmpeg in `bin/`."
          releaseDraft: false
          prerelease: false
