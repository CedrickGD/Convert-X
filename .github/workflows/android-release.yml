# Builds a signed Android release and publishes the APKs to THIS repo's
# GitHub Releases whenever a `v*` tag is pushed (e.g. v0.6.20).
#
# Everything is in the Convert-X monorepo now — source AND releases — so this
# publishes to Convert-X's own releases using the built-in GITHUB_TOKEN (no PAT
# needed). The in-app updater (packages/android/src/lib/updater.ts) reads this
# repo's release list and picks the newest release that has an APK asset.
#
# Keep the tag as plain `v*`. The updater does `tag_name.replace(/^v/, '')`
# and semver-parses the rest, so a prefixed tag (e.g. android-v0.6.20) would
# parse to NaN. Desktop releases use `desktop-v*` (MSI, no APK) and are simply
# skipped by the updater.
#
# Required repository secrets on CedrickGD/Convert-X
# (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64    base64-encoded release keystore (.jks)
#   RELEASE_KEYSTORE_PASSWORD  store password
#   RELEASE_KEY_ALIAS          key alias inside the keystore
#   RELEASE_KEY_PASSWORD       key password
#
# See packages/android/android/app/build.gradle: the release signingConfig
# only activates when CONVERT_X_KEYSTORE_FILE is present in gradle properties,
# which we write at job time.

name: Release Android APKs

on:
  push:
    tags:
      - 'v*'

# Needed so softprops/action-gh-release can create/update the Release.
permissions:
  contents: write

# Silence the "Node.js 20 actions are deprecated" annotation.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-release:
    name: Build & publish signed APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/android/package-lock.json

      # Persist Gradle's dependency cache + wrapper between runs. Without
      # this each tag re-downloads ~500 MB of AndroidX/FFmpeg-kit/etc.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/android/android/gradle/wrapper/gradle-wrapper.properties', 'packages/android/android/**/*.gradle', 'packages/android/android/**/*.gradle.kts', 'packages/android/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm dependencies
        working-directory: packages/android
        run: npm ci

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret set — building debug-signed APK."
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > packages/android/android/app/release.keystore
            test -s packages/android/android/app/release.keystore
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gradle assembleRelease (signed)
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: packages/android/android
        env:
          KS_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # R8 minify is OFF until proguard keep-rules cover all the
          # reflectively-loaded Expo Modules + FFmpegKit / yt-dlp paths.
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PCONVERT_X_KEYSTORE_FILE=release.keystore \
            -PCONVERT_X_KEYSTORE_PASSWORD="${KS_PASSWORD}" \
            -PCONVERT_X_KEY_ALIAS="${KEY_ALIAS}" \
            -PCONVERT_X_KEY_PASSWORD="${KEY_PASSWORD}" \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false

      - name: Gradle assembleRelease (debug-signed fallback)
        if: steps.keystore.outputs.have_keystore == 'false'
        working-directory: packages/android/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false

      - name: List generated APKs
        working-directory: packages/android/android
        run: |
          ls -lh app/build/outputs/apk/release/
          # Fail fast if the arm64 APK is missing — we only build that ABI.
          test -f app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Publishes to THIS repo (Convert-X) with the built-in GITHUB_TOKEN.
          # The workflow's `permissions: contents: write` covers it — no PAT.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: packages/android/android/app/build/outputs/apk/release/*.apk
