# Builds the Expo *dev client* (debug variant) and publishes it to a rolling
# `dev` pre-release in THIS repo, so a test phone can install it from one stable URL.
#
# The dev client loads its JS from a Metro bundler over the network. After
# installing this APK once, you iterate by running `npx expo start --tunnel`
# (see packages/android/README "Live reload from a Codespace") and JS/TS edits
# hot-reload on the phone. Re-run this workflow only when NATIVE code changes —
# the Kotlin modules under packages/android/modules/, native deps, or
# packages/android/android/ + app.json config.
#
# Debug builds carry the `.dev` applicationId suffix (app/build.gradle) and a
# debug signature, so this installs ALONGSIDE the production app and never
# collides with the in-app updater (which ignores pre-releases).

name: Build Android dev client

on:
  workflow_dispatch:

# Needed so softprops/action-gh-release can create/update the `dev` release.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dev-client:
    name: Build & publish dev-client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/android/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/android/android/gradle/wrapper/gradle-wrapper.properties', 'packages/android/android/**/*.gradle', 'packages/android/android/**/*.gradle.kts', 'packages/android/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm dependencies
        working-directory: packages/android
        run: npm ci

      # Debug is a debuggable variant, so the React Native plugin skips JS
      # bundling — the APK loads its bundle from Metro at runtime. Signed with
      # the committed debug.keystore; no release secrets needed.
      - name: Gradle assembleDebug
        working-directory: packages/android/android
        # Dev client stays arm64-only — no need to build the 32-bit ABI for a
        # test phone, and it keeps this build fast. The release splits default
        # to arm64-v8a,armeabi-v7a (app/build.gradle); override both the split
        # and the RN C++ ABI list so only arm64-v8a is compiled and packaged.
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Pconvertx.splitAbis=arm64-v8a -PreactNativeArchitectures=arm64-v8a

      - name: Locate APK
        id: apk
        run: |
          ls -lh packages/android/android/app/build/outputs/apk/debug/
          # The ABI split in app/build.gradle applies to debug too, so there is
          # no universal APK — just the arm64-v8a one.
          APK=packages/android/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: convert-x-dev-client
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish to rolling `dev` pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev client (rolling)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Rolling **Expo dev client** (debug build). Install once, then run
            `npx expo start --tunnel` and your JS/TS edits hot-reload on the phone.

            - Package id `com.cedrickgd.convertx.dev` — installs alongside the production app.
            - Debug-signed; allow "install unknown apps" for your browser/installer.
            - Rebuilt from the latest commit each time this workflow runs.
          files: ${{ steps.apk.outputs.path }}

      - name: Summary
        run: |
          {
            echo "### Dev client built ✅"
            echo
            echo "**Install on your phone (one time):**"
            echo
            echo "https://github.com/${{ github.repository }}/releases/download/dev/app-arm64-v8a-debug.apk"
            echo
            echo "Then in the Codespace run \`npx expo start --tunnel\`, open **Convert-X (dev)**, and scan the QR."
          } >> "$GITHUB_STEP_SUMMARY"
