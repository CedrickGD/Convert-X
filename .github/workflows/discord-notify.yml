name: Discord Notifications

on:
  push:
    branches: [main]
    tags: ["v*", "desktop-v*"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Push Notification
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URL: ${{ secrets.FLTU_DISCORD_NOTIFY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"
          TIMESTAMP=$(date -u +"%d.%m.%Y %H:%M")
          COMMIT_URL="https://github.com/${REPO}/commit/${GITHUB_SHA}"
          DESC="[\`${SHORT_SHA}\`](${COMMIT_URL})  ${FIRST_LINE}"

          PAYLOAD=$(jq -n \
            --arg author "$ACTOR" \
            --arg desc "$DESC" \
            --arg footer "${REPO} • ${TIMESTAMP}" \
            '{embeds: [{color: 5793266, author: {name: $author}, title: "Push to main", description: $desc, footer: {text: $footer}}]}')

          curl -s -H "Content-Type: application/json" -X POST "$WEBHOOK_URL" -d "$PAYLOAD"

      - name: Release Notification
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WEBHOOK_URL: ${{ secrets.FLTU_DISCORD_NOTIFY }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ACTOR="${{ github.actor }}"
          TIMESTAMP=$(date -u +"%d.%m.%Y %H:%M")
          # Desktop releases (desktop-v*) publish to this repo; Android
          # releases (v*) publish to the Convert-X-Android-APK release repo
          # that the in-app updater polls. Link to whichever actually holds
          # the assets.
          if [[ "$TAG" == desktop-v* ]]; then
            PLATFORM="Desktop"
            RELEASE_REPO="CedrickGD/Convert-X"
          else
            PLATFORM="Android"
            RELEASE_REPO="CedrickGD/Convert-X-Android-APK"
          fi
          RELEASE_URL="https://github.com/${RELEASE_REPO}/releases/tag/${TAG}"
          DESC="${TAG} is now available.\n\n[Download from GitHub](${RELEASE_URL})"

          PAYLOAD=$(jq -n \
            --arg author "$ACTOR" \
            --arg title "Release: ConvertX ${PLATFORM} ${TAG}" \
            --arg desc "$DESC" \
            --arg footer "${RELEASE_REPO} • ${TIMESTAMP}" \
            '{embeds: [{color: 5025616, author: {name: $author}, title: $title, description: $desc, footer: {text: $footer}}]}')

          curl -s -H "Content-Type: application/json" -X POST "$WEBHOOK_URL" -d "$PAYLOAD"
